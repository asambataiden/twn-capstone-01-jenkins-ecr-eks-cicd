
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone01-app
  namespace: capstone-01
  labels:
    app.kubernetes.io/name: capstone01-app
    app.kubernetes.io/part-of: twn-capstone-01
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone01-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capstone01-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: 591132357918.dkr.ecr.eu-north-1.amazonaws.com/twn-capstone-01/capstone01-app@sha256:4b46edf007cb4ddc07d9c4004a8678d59c29c365be6f50d6aeb8ff433a516c78
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: capstone01-app
  namespace: capstone-01
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: capstone01-app
  ports:
    - name: http
      port: 8080
      targetPort: http
